<article class="section-card overflow-hidden transition duration-300 hover:-translate-y-1 hover:shadow-xl">
	@if (showImage) {
		<img [src]="product.image" [attr.alt]="product.name" title="Product image" class="h-48 w-full object-cover" loading="lazy" />
	}
	<div class="space-y-3 p-4">
		<p class="inline-flex rounded-full bg-[color:color-mix(in_srgb,var(--wood-500)_18%,transparent)] px-3 py-1 text-xs font-semibold text-[var(--wood-800)]">
			{{ product.category }}
		</p>
		<h3 class="text-xl font-semibold text-[var(--wood-900)]">{{ product.name }}</h3>
		<p class="text-sm text-[var(--muted)]">{{ product.description }}</p>
		<a [href]="enquiryLink" target="_blank" rel="noopener noreferrer" class="wood-btn inline-block text-sm">Enquire Now</a>
	</div>
</article>
